<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - MealMend</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="register.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="logo">
        <img src="../images/MealMend.jpg" alt="MealMend Logo" />
        <h3>MealMend</h3>
      </div>
    </header>

    <section class="form-section">
      <h2>Sign Up</h2>
      <form id="signup-form" method="POST" enctype="multipart/form-data" action="/register">
        <input
          type="text"
          name="fullName"
          id="signup-name"
          placeholder="Name"
          required
        />
        <span class="error-message" id="nameError" style="display: none"></span>

        <input
          type="email"
          name="email"
          id="signup-email"
          placeholder="Email (must end with gmail.com)"
          required
        />
        <span class="error-message" id="emailError" style="display: none"></span>

        <input
          type="text"
          name="phone"
          id="signup-phone"
          placeholder="Phone"
          required
        />
        <span class="error-message" id="phoneError" style="display: none"></span>

        <input
          type="password"
          name="password"
          id="signup-password"
          placeholder="Password"
          required
        />
        <span
          class="error-message"
          id="passwordError"
          style="display: none"
        ></span>

        <div class="show-password">
          <input type="checkbox" id="showPassword" />
          <label for="showPassword">Show Password</label>
        </div>

        <select id="user-role" name="role" required>
          <option value="" disabled selected>Select your role</option>
          <option value="donor">Donor</option>
          <option value="partner">Partner</option>
          <option value="volunteer">Volunteer</option>
        </select>

        <p>Profile Picture</p>
        <input
        type="file"
        id="avatar"
        placeholder="image for profile"
        name="avatar"
      />
        <button type="submit">Sign Up</button>
        <div class="loading" id="loading" style="display: none">Loading...</div>
      </form>
      <p>Already have an account? <a href="../Login/login.html">Login</a></p>
    </section>

    <footer>
      <p>&copy; 2024 MealMend. All Rights Reserved.</p>
    </footer>

    <script src="./register.js"></script>
  </body>
</html>
