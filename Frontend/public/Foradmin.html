<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Status - MealMend</title>
    <style>
      body {
        font-family: "Roboto", sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f0f0f0;
      }

      .navbar {
        display: flex;
        height: 60px;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
        padding-right: 20px;
        background-color: #4caf50;
        box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1);
        position: fixed;
        width: 100%;
        top: 0;
        z-index: 1000;
      }

      .logo {
        display: flex;
        align-items: center;
      }

      .logo img {
        width: 60px;
        height: 60px;
        margin-right: 10px;
        animation-duration: 3s;
        animation-name: spin;
        animation-fill-mode: forwards;
      }

      @keyframes spin {
        0%,
        50% {
          transform: scale(1);
        }
        100% {
          transform: rotate(360deg) scale(1.2);
          border-radius: 50%;
        }
      }

      .logo h3 {
        margin: 0;
        font-size: 25px;
        color: #333;
      }

      .container {
        margin-top: 100px;
        text-align: center;
        padding: 20px;
      }

      h1 {
        margin-bottom: 30px;
      }

      .card {
        background: #fff;
        margin: auto;
        padding: 20px;
        max-width: 600px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .card h2 {
        color: #708090;
        margin-bottom: 10px;
      }

      .card p {
        color: #555;
        font-size: 16px;
        margin-bottom: 20px;
      }

      footer {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 50px;
        background-color: #8b4513;
        color: #fff;
        position: fixed;
        bottom: 0;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <header class="navbar">
      <div class="logo">
        <img src="../images/MealMend.jpg" alt="logo" />
        <h3>MealMend</h3>
      </div>
    </header>

    <div class="container">
      <h1>Admin Status</h1>

      <section class="card admin">
        <h2>Admin Access</h2>
        <p>You are not applicable for admin.</p>
      </section>
    </div>

    <footer>
      <p>&copy; 2024 MealMend. All Rights Reserved.</p>
    </footer>
  </body>
</html>
