<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Volunteer Page</title>
        <link rel="stylesheet" href="Volunteer.css" />
    </head>
    <body>
        <header class="navbar">
            <div class="logo">
                <img src="../images/MealMend.jpg" alt="logo" />
                <h3>MealMend</h3>
            </div>
        </header>

        <div class="profile-card">
            <div class="profile-picture">
                <label for="profilePicInput">
                    <img
                        src=""
                        alt="Profile Picture"
                        id="profile-pic"
                    />
                </label>
                
            </div>
            <div class="details">
                <h2 id="name"></h2>
                <p>
                    Email :-
                    <span id="email"></span>
                </p>
                <p>
                    Phone Number :-
                    <span id="phone"></span>
                </p>
                <button class="edit-btn">Edit Profile</button>
            </div>
        </div>

        <section id="dashboard">
            <h2>Dashboard</h2>
            <div id="current-tasks">
                <h3>Current Tasks</h3>
                <ul id="task-list"></ul>
            </div>
            <div id="completed-tasks">
                <h3>Completed Tasks</h3>
                <ul id="completed-task-list"></ul>
            </div>
        </section>

        <section id="task-details" style="display: none">
            <h2>Task Details</h2>
            <p id="task-info"></p>
            <p><strong>Delivery/Pickup Details:</strong></p>
            <p id="pickup-delivery-info"></p>
            <button id="complete-task">Complete Task</button>
        </section>

        <section id="live-tracking">
            <h2>Live Tracking</h2>
            <button onclick="getLocation()">Show My Location</button>
            <p id="location"></p>
            <div id="map" style="height: 300px; width: 100%"></div>
        </section>

        <section id="feedback">
            <h2>Feedback</h2>
            <form id="feedback-form">
                <label for="feedback">Your Feedback:</label>
                <textarea id="feedback" required></textarea>
                <button type="submit">Submit Feedback</button>
            </form>
        </section>

        <section id="emergency-contact">
            <h2>Emergency Contact</h2>
            <p>
                In case of emergency, contact <strong>John Doe</strong> at
                <strong>(123) 456-7890</strong>.
            </p>
        </section>

        <footer>
            <p>
                Alert: <span id="alert-message">No alerts at this time.</span>
            </p>
        </footer>

        <script src="Volunteer.js"></script>
    </body>
</html>
