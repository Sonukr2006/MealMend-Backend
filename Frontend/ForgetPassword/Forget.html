<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Forgot Password</title>
        <link rel="stylesheet" href="Forget.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
            integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        />
    </head>
    <body>
        <header class="navbar">
            <div class="logo">
                <img src="../images/MealMend.jpg" alt="logo" />
                <h3>MealMend</h3>
            </div>
        </header>
        <div class="container">
            <h2>Forgot Password</h2>
            <form action="/auth/forgot_password" method="POST">
                <label for="email">Enter your email:</label>
                <input type="email" id="email" name="email" required />
                <button type="submit">Send Reset Link</button>
            </form>
            <p class="message">We'll send a reset link to your email.</p>
            <p class="link">
                Don't have an account?
                <a
                    href="../SignUp/signup.html"
                    style="color: #4caf50"
                    ,font-weight="bold"
                    >Sign Up</a
                >
            </p>
        </div>

        <footer>
            <p>&copy; 2024 MealMend. All Rights Reserved.</p>
        </footer>
        <script src="Forget.js"></script>
    </body>
</html>
